<!doctype html>
<html><head><meta charset="utf-8">
<!-- 2026-11-28 STORY variant "dinner" (1080x1920, safe zone y 250..1600): F1 dialogue mini-story, mode سفر.
     bgTrattoria() restaurant at night on a trip (arched window with evening street, string lights, wall menu board, "Trattoria Sole" sign),
     table front with plates/candle/bill folder, 3 characters (Kaveh, Golnaz, waiter sliding in with a handheld POS),
     panel pages: bill (hook), bank card with red X (problem), Google Wallet with zoodcart card (solution), POS close-up tap, museum ticket paid online. -->
<style>
@font-face{font-family:Vaz;src:url(font/package/fonts/ttf/Vazirmatn-Medium.ttf);font-weight:500}
@font-face{font-family:Vaz;src:url(font/package/fonts/ttf/Vazirmatn-Bold.ttf);font-weight:700}
@font-face{font-family:Vaz;src:url(font/package/fonts/ttf/Vazirmatn-Black.ttf);font-weight:900}
svg text{direction:ltr;unicode-bidi:embed}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1A0F0A;font-family:Vaz,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
#panel{position:absolute;left:80px;top:270px;width:920px;height:640px;border-radius:40px;background:#F7F5FF;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;transform-origin:50% 0%}
#hdr{position:absolute;left:0;right:0;top:0;height:104px;background:#1E1440;display:flex;align-items:center;justify-content:center;gap:20px;direction:rtl}
.stp{font-size:30px;font-weight:900;color:#1E1440;background:#FFD43B;border-radius:999px;padding:2px 24px}
.ht{font-size:40px;font-weight:900;color:#fff}
.pg{position:absolute;left:0;top:104px;width:920px;height:536px;opacity:0}
.card{width:500px;height:300px;border-radius:30px;background:linear-gradient(135deg,#9F67FF 0%,#7C3AED 45%,#4C1D95 100%);position:relative;box-shadow:0 20px 50px rgba(124,58,237,.5);direction:ltr;text-align:left;overflow:hidden}
.card .chip{position:absolute;left:44px;top:108px;width:76px;height:56px;border-radius:12px;background:linear-gradient(135deg,#FFE29A,#D4A537)}
.card .nm{position:absolute;left:44px;top:32px;font-size:34px;font-weight:900;color:#fff}
.card .vt{position:absolute;right:40px;top:40px;font-size:22px;font-weight:700;color:#E9DDFF;letter-spacing:3px}
.card .num{position:absolute;left:44px;bottom:40px;font-size:32px;font-weight:700;color:#fff;letter-spacing:4px}
.card .vs{position:absolute;right:40px;bottom:32px;font-size:44px;font-weight:900;font-style:italic;color:#fff}
#subs{position:absolute;left:50px;right:50px;top:1335px;direction:rtl;text-align:center}
.sb{display:inline-block;background:rgba(26,15,10,.86);border-radius:30px;padding:20px 34px 24px;border:3px solid rgba(255,212,59,.4);max-width:980px}
.who{display:inline-block;font-size:28px;font-weight:900;color:#fff;border-radius:999px;padding:4px 22px;margin-bottom:6px}
.tx{font-size:44px;font-weight:700;color:#fff;line-height:1.5}
#cta{background:linear-gradient(180deg,#0B0820,#1A1035);direction:rtl;text-align:center;opacity:0}
.glow{position:absolute;border-radius:50%;filter:blur(120px);background:#7C3AED}
.pill{display:inline-block;background:#7C3AED;color:#fff;font-weight:700;border-radius:999px}
.opill{display:inline-block;border:5px solid #C4A7FF;color:#C4A7FF;font-weight:700;border-radius:999px}
.tags{display:flex;justify-content:center;gap:18px;margin-top:40px;direction:rtl}
.tags span{font-size:40px;font-weight:900;color:#1E1440;background:#FFD43B;border-radius:999px;padding:6px 30px}
</style></head>
<body><div id="stage">
<svg id="room" class="layer" viewBox="0 0 1080 1920"></svg>
<svg id="chars" class="layer" viewBox="0 0 1080 1920"></svg>
<svg id="front" class="layer" viewBox="0 0 1080 1920"></svg>
<div id="panel">
  <div id="hdr"><span class="stp" id="stp"></span><span class="ht" id="ht"></span></div>
  <div class="pg" id="pgBill" style="background:linear-gradient(180deg,#FFF9DB,#FFE8A3)"><svg id="billSvg" width="920" height="536" viewBox="0 0 920 536"></svg></div>
  <div class="pg" id="pgProb" style="background:linear-gradient(180deg,#FFF5F5,#FFC9C9)"><svg id="probSvg" width="920" height="536" viewBox="0 0 920 536"></svg></div>
  <div class="pg" id="pgWal" style="background:linear-gradient(180deg,#F3F0FF,#D0BFFF)"><svg id="walSvg" width="920" height="536" viewBox="0 0 920 536"></svg></div>
  <div class="pg" id="pgTap" style="background:linear-gradient(180deg,#E7F5FF,#A5D8FF)"><svg id="tapSvg" width="920" height="536" viewBox="0 0 920 536"></svg></div>
  <div class="pg" id="pgMus" style="background:linear-gradient(180deg,#EBFBEE,#B2F2BB)"><svg id="musSvg" width="920" height="536" viewBox="0 0 920 536"></svg></div>
</div>
<svg id="fx" class="layer" viewBox="0 0 1080 1920"></svg>
<div id="subs"></div>
<div id="cta" class="layer">
  <div class="glow" style="left:-250px;top:250px;width:800px;height:800px;opacity:.45"></div>
  <div class="glow" style="left:550px;top:1050px;width:750px;height:750px;opacity:.35"></div>
  <div style="position:absolute;left:0;right:0;top:320px" id="ctain">
    <div class="pill" style="font-size:50px;padding:16px 50px">ویزا کارت مجازی زودکارت</div>
    <div class="tags"><span>آنلاین</span><span>حضوری</span><span>سفر</span></div>
    <div class="card" style="margin:60px auto 0;transform:rotate(-6deg)"><div class="nm">zoodcart</div><div class="vt">VIRTUAL CARD</div><div class="chip"></div><div class="num">•••• 2468</div><div class="vs">VISA</div></div>
    <div style="font-size:150px;font-weight:900;color:#fff;direction:ltr;margin-top:50px;line-height:1.1">zoodcart.ir</div>
    <div style="font-size:54px;color:#BEBACD;font-weight:500;margin-top:14px">ثبت سفارش آنلاین</div>
    <div class="opill" style="font-size:50px;padding:12px 70px;margin-top:36px">لینک در بیو</div>
  </div>
</div>
</div>
<script>
const C = window.CUES; const AMP = window.AMPS; const FPS=30;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const L=(p,q,x)=>[lerp(p[0],q[0],x),lerp(p[1],q[1],x)];
function amp(key,t){const c=C.cues[key]; if(!c) return 0; const s=c[0],d=c[1]; if(t<s||t>s+d) return 0; const a=AMP[key]; const i=Math.floor((t-s)*FPS); return a[Math.min(i,a.length-1)]||0}
const $=id=>document.getElementById(id);
const E=C.ev;
const T=(x,y,s,f,c,w,a)=>`<text x="${x}" y="${y}" ${a?`text-anchor="${a}"`:''} font-family="Vaz" font-weight="${w||900}" font-size="${s}" fill="${c||'#fff'}">${f}</text>`;
// ---------- restaurant on a trip, at night (reusable): bgTrattoria(t) ----------
function bgTrattoria(t){
 let s=`<defs><linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1F4B"/><stop offset="1" stop-color="#4B3F8F"/></linearGradient></defs>
 <rect width="1080" height="1920" fill="#C8553D"/>`;
 // wall texture: plaster patches
 for(let i=0;i<26;i++){const r1=Math.sin(i*91.7)*999, r=r1-Math.floor(r1), r2=Math.sin(i*13.3)*777, q=r2-Math.floor(r2); s+=`<ellipse cx="${r*1080}" cy="${80+q*1200}" rx="${30+q*40}" ry="${14+r*12}" fill="#B5462F" opacity=".45"/>`}
 // sign at top (decorative zone)
 s+=`<g transform="translate(540,150)"><rect x="-250" y="-52" width="500" height="104" rx="22" fill="#2B1B17"/><rect x="-236" y="-38" width="472" height="76" rx="14" fill="none" stroke="#FFD43B" stroke-width="3"/>${T(0,18,54,'Trattoria Sole','#FFD43B',900,'middle')}</g>`;
 // arched window (left) with evening street
 const wx=60,wy=880,ww=420,wh=420;
 s+=`<path d="M${wx} ${wy+wh} V${wy+150} Q${wx} ${wy} ${wx+ww/2} ${wy} Q${wx+ww} ${wy} ${wx+ww} ${wy+150} V${wy+wh}Z" fill="url(#nsky)"/>`;
 s+=`<circle cx="${wx+330}" cy="${wy+90}" r="26" fill="#FFF3BF"/>`;
 const hs=[[wx+10,wy+200,110,'#5F3DC4'],[wx+120,wy+160,100,'#7048E8'],[wx+220,wy+230,90,'#5F3DC4'],[wx+310,wy+190,110,'#6741D9']];
 for(const [x,y,w,c] of hs){s+=`<rect x="${x}" y="${y}" width="${w}" height="${wy+wh-y}" fill="${c}"/>`;for(let yy=y+24;yy<wy+wh-30;yy+=44)for(let xx=x+16;xx<x+w-20;xx+=34)s+=`<rect x="${xx}" y="${yy}" width="16" height="22" rx="3" fill="#FFD43B" opacity="${.5+.4*Math.sin(xx*yy)}"/>`}
 s+=`<path d="M${wx+ww/2} ${wy} V${wy+wh} M${wx} ${wy+200} H${wx+ww}" stroke="#2B1B17" stroke-width="12"/>`;
 s+=`<path d="M${wx} ${wy+wh} V${wy+150} Q${wx} ${wy} ${wx+ww/2} ${wy} Q${wx+ww} ${wy} ${wx+ww} ${wy+150} V${wy+wh}Z" fill="none" stroke="#2B1B17" stroke-width="18"/>`;
 // menu board (right)
 s+=`<g transform="translate(830,1000)"><rect x="-150" y="-110" width="300" height="250" rx="16" fill="#2B2B2B" stroke="#8D5524" stroke-width="14"/>${T(0,-56,36,'MENU','#FFF',900,'middle')}`;
 ['Pasta','Pizza','Soup','Dessert'].forEach((m,i)=>{s+=T(-110,-6+i*36,26,m,'#E9ECEF',700)+`<path d="M10 ${-14+i*36} H110" stroke="#868E96" stroke-width="3" stroke-dasharray="4 8"/>`});
 s+=`</g>`;
 // string lights across the top of the scene area
 s+=`<path d="M0 860 Q270 930 540 870 Q810 930 1080 860" stroke="#2B1B17" stroke-width="4" fill="none"/>`;
 for(let i=0;i<=16;i++){const x=i*67.5, u=(x%540)/540, y=(x<540?860:870)+ (Math.sin(u*Math.PI))*55*(x<540?1:1)+(x>=540?-10*(1-u):0); const on=.65+.35*Math.sin(t*3+i*1.3);
  s+=`<circle cx="${x}" cy="${y+16}" r="22" fill="#FFE066" opacity="${on*.35}"/><circle cx="${x}" cy="${y+16}" r="11" fill="#FFE066" opacity="${on}"/>`}
 s+=`<rect y="1288" width="1080" height="640" fill="#6F4E37"/>`;
 return s;
}
// ---------- character engine (copied from scene.html) ----------
function arm(sh,hand,col,skin,thumb,point){
 let s=`<path d="M${sh[0]} ${sh[1]} Q ${(sh[0]+hand[0])/2+(sh[0]<0?-40:40)} ${(sh[1]+hand[1])/2+30} ${hand[0]} ${hand[1]}" stroke="${col}" stroke-width="58" fill="none" stroke-linecap="round"/>`;
 s+=`<circle cx="${hand[0]}" cy="${hand[1]}" r="32" fill="${skin}"/>`;
 if(thumb) s+=`<rect x="${hand[0]-9}" y="${hand[1]-62}" width="18" height="40" rx="9" fill="${skin}"/>`;
 if(point) s+=`<rect x="${hand[0]-70}" y="${hand[1]-9}" width="50" height="18" rx="9" fill="${skin}"/>`;
 return s;
}
function character(o){
 const sk=o.skin, dk=o.skinDark;
 let s=`<g transform="translate(${o.x},${o.y}) scale(${o.sc||1}) rotate(${o.rot||0})">`+(o.hairBack||'');
 const tl=o.torso||340;
 const back = o.handL[1]>200 && o.handR[1]>200;
 const arms = arm([-120,175],o.handL,o.shirt2,sk,false,o.pointL)+arm([120,175],o.handR,o.shirt2,sk,o.thumbR,false)+(o.hold||'');
 if(back) s+=arms;
 s+=`<path d="M -160 ${tl} Q -165 160 -70 130 L 70 130 Q 165 160 160 ${tl} Z" fill="${o.shirt}"/>`;
 s+=`<path d="M -70 132 Q 0 210 70 132" fill="none" stroke="${o.shirt2}" stroke-width="16" stroke-linecap="round"/>`;
 s+=(o.apron||'');
 s+=`<rect x="-30" y="78" width="60" height="62" rx="20" fill="${dk}"/>`;
 if(!back) s+=arms;
 s+=`<circle cx="-100" cy="12" r="22" fill="${dk}"/><circle cx="100" cy="12" r="22" fill="${dk}"/>`;
 s+=`<ellipse cx="0" cy="0" rx="104" ry="108" fill="${sk}"/>`;
 s+=o.hairSvg;
 const ey=o.blink?2:24, lx=o.lookx||0, ly=o.looky||0;
 for(const ex of [-38,38]){
   s+=`<ellipse cx="${ex}" cy="2" rx="19" ry="${ey}" fill="#fff"/>`;
   if(!o.blink) s+=`<circle cx="${ex+lx}" cy="${4+ly}" r="11" fill="#1B1430"/><circle cx="${ex+lx+4}" cy="${ly-1}" r="3.5" fill="#fff"/>`;
 }
 if(o.glasses) s+=`<g fill="none" stroke="#1B1430" stroke-width="6"><circle cx="-38" cy="2" r="30"/><circle cx="38" cy="2" r="30"/><path d="M-8 -2 L8 -2"/></g>`;
 const B={neutral:[-40,-40],angry:[-26,-46],sad:[-52,-34],up:[-60,-56],happy:[-48,-44]}[o.brow];
 s+=`<path d="M -60 ${B[1]} L -18 ${B[0]}" stroke="${o.browCol}" stroke-width="11" stroke-linecap="round"/><path d="M 60 ${B[1]} L 18 ${B[0]}" stroke="${o.browCol}" stroke-width="11" stroke-linecap="round"/>`;
 s+=`<circle cx="-62" cy="40" r="16" fill="#FF8787" opacity=".35"/><circle cx="62" cy="40" r="16" fill="#FF8787" opacity=".35"/>`;
 if(o.beard) s+=o.beard;
 const op=o.open||0, m=o.mouth;
 if(op>0.06){
   const h=10+44*Math.min(1,op*1.4);
   s+=`<path d="M -34 48 Q 0 ${48+h*1.5} 34 48 Z" fill="#5C1A1A"/><path d="M -18 ${48+h*0.9} Q 0 ${48+h*1.3} 18 ${48+h*0.9} Q 0 ${48+h*0.6} -18 ${48+h*0.9}Z" fill="#FF6B6B"/>`;
 } else if(m==='smile') s+=`<path d="M -30 46 Q 0 74 30 46" stroke="#5C1A1A" stroke-width="9" fill="none" stroke-linecap="round"/>`;
 else if(m==='big') s+=`<path d="M -40 42 Q 0 108 40 42 Z" fill="#5C1A1A"/><path d="M -20 74 Q 0 92 20 74 Q 0 66 -20 74Z" fill="#FF6B6B"/>`;
 else if(m==='o') s+=`<ellipse cx="0" cy="58" rx="14" ry="18" fill="#5C1A1A"/>`;
 else s+=`<path d="M -22 56 L 22 56" stroke="#5C1A1A" stroke-width="9" stroke-linecap="round"/>`;
 s+=(o.extra||'');
 return s+'</g>';
}
function sparkles(t){let s='';const P=[[-150,-120],[150,-140],[-170,40],[170,20],[0,-190]];P.forEach((p,i)=>{const k=0.6+0.4*Math.sin(t*8+i*1.7);s+=`<path transform="translate(${p[0]},${p[1]}) scale(${k})" d="M0 -26 Q 4 -4 26 0 Q 4 4 0 26 Q -4 4 -26 0 Q -4 -4 0 -26Z" fill="#FFD43B"/>`});return s}
function arcs(x,y,k,col,rot){let s=`<g transform="translate(${x},${y}) rotate(${rot||0})" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round">`;for(let i=0;i<3;i++){const r=26+i*24;const o=clamp(k*3-i,0,1);s+=`<path d="M ${r*0.5} ${-r*0.87} A ${r} ${r} 0 0 1 ${r*0.5} ${r*0.87}" opacity="${o}"/>`}return s+'</g>'}
// ---------- POS terminal (reusable): state 0 tap, 1 processing, 2 approved ----------
function posTerminal(x,y,sc,state,t){
 let scr='';
 if(state===0) scr=`<text x="0" y="-40" text-anchor="middle" font-family="Vaz" font-weight="900" font-size="34" fill="#fff">Tap</text>`+arcs(-14,10,(t*1.5)%1,'#C4A7FF',0);
 else if(state===1) scr=`<g transform="translate(0,-14) rotate(${t*500})"><circle r="30" stroke="rgba(255,255,255,.3)" stroke-width="8" fill="none"/><path d="M0 -30 A30 30 0 0 1 30 0" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/></g><text x="0" y="62" text-anchor="middle" font-family="Vaz" font-weight="700" font-size="24" fill="#fff">Processing</text>`;
 else scr=`<circle cx="0" cy="-14" r="40" fill="#2F9E44"/><path d="M-18 -14 L-5 0 L20 -28" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="62" text-anchor="middle" font-family="Vaz" font-weight="900" font-size="28" fill="#8CE99A">Approved</text>`;
 let keys='';for(let r=0;r<3;r++)for(let c=0;c<3;c++)keys+=`<rect x="${-66+c*48}" y="${130+r*36}" width="40" height="28" rx="7" fill="#495057"/>`;
 return `<g transform="translate(${x},${y}) scale(${sc})"><rect x="-100" y="-130" width="200" height="380" rx="34" fill="#343A40"/><rect x="-82" y="-110" width="164" height="210" rx="16" fill="${state===2?'#0B3D1E':'#1E1440'}"/>${scr}${keys}</g>`;
}
function phoneBig(x,y,rot,lit){return `<g transform="translate(${x},${y}) rotate(${rot})"><rect x="-90" y="-170" width="180" height="340" rx="32" fill="#1E1E2E"/><rect x="-78" y="-156" width="156" height="312" rx="24" fill="#0F0B1E"/>
 <rect x="-30" y="-150" width="60" height="14" rx="7" fill="#1E1E2E"/>
 <g transform="translate(0,-40)"><rect x="-66" y="-42" width="132" height="84" rx="12" fill="#7C3AED"/><text x="-52" y="-12" font-family="Vaz" font-weight="900" font-size="16" fill="#fff">zoodcart</text><text x="50" y="30" text-anchor="end" font-family="Vaz" font-weight="900" font-style="italic" font-size="20" fill="#fff">VISA</text></g>
 <text x="0" y="70" text-anchor="middle" font-family="Vaz" font-weight="700" font-size="18" fill="${lit?'#8CE99A':'#C4A7FF'}">${lit?'Done':'Hold near reader'}</text></g>`}
// ---------- new looks (2026-11-28 dinner story) ----------
const hairShortBlack=`<path d="M -108 6 Q -116 -118 0 -124 Q 116 -118 108 6 Q 100 -56 64 -70 Q 10 -54 -40 -76 Q -96 -60 -108 6Z" fill="#1B1B1B"/><path d="M -40 -76 Q 0 -112 64 -70" stroke="#343A40" stroke-width="6" fill="none"/>`;
const mustache=`<path d="M -36 40 Q -18 28 0 38 Q 18 28 36 40 Q 18 50 0 44 Q -18 50 -36 40Z" fill="#1B1B1B"/>`;
const hairWavyBack=`<path d="M -126 20 Q -150 -150 0 -146 Q 150 -150 126 20 Q 150 120 120 230 Q 140 260 100 290 L -100 290 Q -140 260 -120 230 Q -150 120 -126 20Z" fill="#6B3E26"/>`;
const hairWavyFront=`<path d="M -112 30 Q -124 -136 0 -134 Q 124 -136 112 30 Q 104 -40 70 -66 Q 30 -40 -20 -60 Q 10 -90 -60 -70 Q -100 -46 -112 30Z" fill="#6B3E26"/><path d="M -104 -84 Q 0 -142 104 -84" stroke="#F783AC" stroke-width="14" fill="none" stroke-linecap="round"/>`;
const earrings=`<circle cx="-100" cy="42" r="9" fill="#FFD43B"/><circle cx="100" cy="42" r="9" fill="#FFD43B"/>`;
const hairSlick=`<path d="M -106 -10 Q -112 -120 0 -126 Q 112 -120 106 -10 Q 96 -76 30 -84 Q -60 -90 -106 -10Z" fill="#495057"/><path d="M -60 -100 Q 10 -120 80 -90" stroke="#868E96" stroke-width="5" fill="none"/>`;
const waiterVest=`<path d="M -150 340 L -150 190 Q -140 150 -78 134 L -26 340Z M 150 340 L 150 190 Q 140 150 78 134 L 26 340Z" fill="#212529"/><path d="M -30 150 L 0 162 L 30 150 L 30 176 L 0 164 L -30 176Z" fill="#C92A2A"/>`;
function sweat(x,y,t){const k=(t*1.4)%1;return `<path transform="translate(${x},${y+k*30})" d="M0 -22 Q 14 0 0 10 Q -14 0 0 -22Z" fill="#74C0FC" opacity="${1-k}"/>`}
function phoneHold(h,glow,skin){return `<g transform="translate(${h[0]},${h[1]-40}) rotate(-12)"><rect x="-34" y="-62" width="68" height="124" rx="14" fill="#1E1E2E"/><rect x="-28" y="-54" width="56" height="106" rx="9" fill="${glow?'#7C3AED':'#4C1D95'}"/><rect x="-22" y="-20" width="44" height="28" rx="5" fill="#C4A7FF"/></g><circle cx="${h[0]}" cy="${h[1]+10}" r="30" fill="${skin}"/>`}
function bankCard(x,y,rot,sc){return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${sc})"><rect x="-130" y="-80" width="260" height="160" rx="18" fill="#868E96"/><rect x="-104" y="-30" width="50" height="38" rx="8" fill="#E9C46A"/>${T(-104,-44,22,'BANK CARD')}${T(-104,56,22,'•••• 1290','#fff',700)}</g>`}
// small handheld POS (waiter) – reuse posTerminal at small scale inside a hand
function handPos(h,state,t,skin){return posTerminal(h[0],h[1]-60,0.42,state,t)+`<circle cx="${h[0]}" cy="${h[1]+16}" r="30" fill="${skin}"/>`}

function render(t){
 $('room').innerHTML=bgTrattoria(t);
 // ---------- panel pages ----------
 const pages=[['pgBill',0,E.k1],['pgProb',E.k1,E.g1],['pgWal',E.g1,E.w1],['pgTap',E.w1,E.g2],['pgMus',E.g2,99]];
 for(const [id,a,b] of pages){const o=seg(t,a,a+.3)*(1-seg(t,b,b+.3));$(id).style.opacity=o;$(id).style.transform=`translateX(${(1-seg(t,a,a+.3))*-60}px)`}
 let stp,ht;
 if(t<E.k1){stp='توی سفر';ht='شام آخر سفر'}
 else if(t<E.g1){stp='مشکل';ht='حالا چطوری حساب کنیم؟'}
 else if(t<E.w1){stp='راه‌حل';ht='ویزا کارت زودکارت در گوگل‌پی'}
